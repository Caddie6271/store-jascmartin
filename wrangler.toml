name = "store-jascmartin"
main = "src/index.js"
compatibility_date = "2026-09-25"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "store-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
APP_URL = "https://store.jascmartin.com"
GOOGLE_CLIENT_ID = ""
